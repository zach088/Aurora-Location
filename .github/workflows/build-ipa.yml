name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, free-lite]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned app
        run: |
          xcodebuild -project AuroraLocation.xcodeproj \
            -scheme AuroraLocation \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X Aurora-Location-lite.ipa Payload
          ls -lh Aurora-Location-lite.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Location-lite
          path: Aurora-Location-lite.ipa
          retention-days: 7
